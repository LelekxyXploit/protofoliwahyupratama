<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vidio Testi | Wahyu Pratama</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Poppins', sans-serif;
    background: #0a0a0f;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

header {
    background: rgba(10,10,15,.95);
    border-bottom: 1px solid rgba(255,0,0,.3);
    padding: 18px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.logo {
    color: #ff0000;
    font-size: 20px;
    font-weight: 700;
}

.back {
    color: white;
    text-decoration: none;
    border: 1px solid #ff0000;
    border-radius: 30px;
    padding: 9px 18px;
    font-size: 13px;
    transition: .3s;
}

.back:hover {
    background: #ff0000;
}

main {
    max-width: 1000px;
    width: 90%;
    margin: auto;
    padding: 75px 0;
}

.heading {
    text-align: center;
    margin-bottom: 45px;
}

.heading small {
    color: #AD4AE7;
    letter-spacing: 5px;
    font-weight: 600;
}

.heading h1 {
    font-size: clamp(38px, 7vw, 70px);
    font-weight: 800;
    margin: 12px 0;
}

.heading h1 span {
    color: #ff0000;
}

.heading p {
    color: #aaa;
    font-size: 14px;
    line-height: 1.8;
}

.video-card {
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(173,74,231,.3);
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.video-box {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
}

.video-box video {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.video-info {
    padding: 25px 8px 12px;
}
